[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "python-lib"
version = "0.1.0"
description = "Reusable Python library package for the generated monorepo"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.14.14",
  "mypy>=1.19.1"
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.14.14",
  "mypy>=1.19.1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/python_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling>=1.26.3"]
build-backend = "hatchling.build"

[project]
name = "python-app"
version = "0.1.0"
description = "Python CLI and Textual TUI application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "rich>=14.3.3",
  "textual>=8.0.1",
]

[project.scripts]
python-app = "python_app.entry_points:run_cli"
python-app-tui = "python_app.entry_points:run_tui"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.14.14",
  "mypy>=1.19.1"
]

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "ruff>=0.14.14",
  "mypy>=1.19.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

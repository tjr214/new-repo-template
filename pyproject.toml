[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[project]
name = "nurt-ai"
version = "0.1.0"
description = "Nu-Repo Template AI-first project generator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "jsonschema>=4.26.0",
  "pyyaml>=6.0.3",
  "rich>=14.3.3",
  "textual>=8.0.1",
]

[project.scripts]
nurt = "new_repo_template.nurt_cli:main"

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.13.2",
  "mypy>=1.19.1",
  "pre-commit>=4.5.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.14",
  "types-requests>=2.32.4.20260107",
]

[tool.uv.build-backend]
module-name = "new_repo_template"
module-root = "src"
source-include = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.bun/install/cache
            ~\AppData\Local\uv\cache
            ~\AppData\Local\bun\install\cache
          key: ${{ runner.os }}-deps-${{ hashFiles('pyproject.toml', 'uv.lock', 'version-baseline.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Run cross-platform command smoke contracts (non-Windows)
        if: ${{ runner.os != 'Windows' }}
        run: >-
          uv run pytest
          tests/contracts/test_bun_workspace_install_contract.py
          tests/contracts/test_convex_backend_smoke_contract.py
          tests/contracts/test_desktop_runtime_smoke_contract.py
          tests/contracts/test_mobile_tv_runtime_smoke_contract.py
          tests/contracts/test_tv_input_hid_contract.py
          tests/contracts/test_turbo_command_smoke_contract.py
          tests/contracts/test_python_lane_contract.py::test_python_target_scaffold_runs_baseline_commands

      - name: Run Windows critical contracts
        if: ${{ runner.os == 'Windows' }}
        run: >-
          uv run pytest
          tests/contracts/test_bun_workspace_install_contract.py
          tests/contracts/test_convex_backend_smoke_contract.py
          tests/contracts/test_desktop_runtime_smoke_contract.py
          tests/contracts/test_turbo_command_smoke_contract.py
          tests/contracts/test_python_lane_contract.py::test_python_target_scaffold_runs_baseline_commands

      - name: Run full test suite (non-Windows)
        if: ${{ runner.os != 'Windows' }}
        run: uv run pytest

  preset-regression-suite:
    name: Preset Regression Suite
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.bun/install/cache
            ~\AppData\Local\uv\cache
            ~\AppData\Local\bun\install\cache
          key: ${{ runner.os }}-deps-${{ hashFiles('pyproject.toml', 'uv.lock', 'version-baseline.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Run preset regression contract suite
        run: >-
          uv run pytest
          tests/contracts/test_required_preset_matrix_contract.py
          tests/contracts/test_target_matrix_and_auth_contract.py
          tests/contracts/test_fullstack_auth_wiring_contract.py

  versions-guardrail:
    name: Version Baseline Guardrail
    runs-on: ubuntu-latest
    needs:
      - test-matrix
      - preset-regression-suite
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Restore dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.bun/install/cache
            ~\AppData\Local\uv\cache
            ~\AppData\Local\bun\install\cache
          key: ${{ runner.os }}-deps-${{ hashFiles('pyproject.toml', 'uv.lock', 'version-baseline.json') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Enforce version + lockfile governance
        run: uv run nurt versions check --check-lockfiles --check-latest

  secret-scan-advisory:
    name: Secret Scan (Advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run lightweight secret scan (advisory)
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Run cross-platform command smoke contracts
        run: >-
          uv run pytest
          tests/contracts/test_bun_workspace_install_contract.py
          tests/contracts/test_convex_backend_smoke_contract.py
          tests/contracts/test_turbo_command_smoke_contract.py
          tests/contracts/test_python_lane_contract.py::test_python_target_scaffold_runs_baseline_commands

      - name: Run test suite
        run: uv run pytest

  versions-guardrail:
    name: Version Baseline Guardrail
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Enforce version + lockfile governance
        run: uv run nurt versions check --check-lockfiles --check-latest

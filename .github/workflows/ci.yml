name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-matrix:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Run test suite
        run: uv run pytest

  versions-guardrail:
    name: Version Baseline Guardrail
    runs-on: ubuntu-latest
    needs:
      - test-matrix
    env:
      NURT_UPDATE_CHECK_SIMULATE: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install project dependencies
        run: uv sync --all-extras --dev

      - name: Enforce version + lockfile governance
        run: uv run nurt versions check --check-lockfiles --check-latest
